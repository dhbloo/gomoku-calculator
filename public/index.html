<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- 定义文档的字符编码 -->
    <meta charset="utf-8" />
    <!-- 强制Chromium内核，作用于360浏览器、QQ浏览器等国产双核浏览器 -->
    <meta name="renderer" content="webkit" />
    <!-- 强制Chromium内核，作用于其他双核浏览器 -->
    <meta name="force-rendering" content="webkit" />
    <!-- 如果有安装 Google Chrome Frame 插件则强制为Chromium内核，否则强制本机支持的最高版本IE内核，作用于IE浏览器 -->
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
    <!-- 不让百度转码 -->
    <meta http-equiv="Cache-Control" content="no-siteapp" />
    <!-- QQ应用模式 -->
    <meta name="x5-page-mode" content="app" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gomocalc" />
    <meta name="description" content="A powerful and easy-to-use online Gomoku/Renju AI" />
    <link rel="shortcut icon" sizes="192x192" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/css/font-awesome.min.css" />
    <title>五子棋计算器 Gomoku Calculator</title>
    <% if (typeof VUE_APP_ICP_TEXT !== 'undefined' && VUE_APP_ICP_TEXT) { %>
    <style id="icp-footer-style">
      #icp-footer {
        box-sizing: border-box;
        min-height: 28px;
        padding: 5px 10px;
        text-align: center;
        border-top: 1px solid #dfe2e5;
        background: #f4f4f6;
        font: 12px/17px sans-serif;
      }
      #icp-footer a {
        color: #555;
        text-decoration: none;
      }
      #icp-footer a:hover {
        text-decoration: underline;
      }
    </style>
    <% } %>
  </head>

  <body>
    <noscript>
      <strong
        >We're sorry but Gomoku Calculator doesn't work properly without JavaScript enabled. Please
        enable it to continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->

    <!-- Optional site footer (e.g. ICP filing number for sites hosted in mainland China).
         Rendered only when VUE_APP_ICP_TEXT is set at build time, e.g. in .env.production.local:
           VUE_APP_ICP_TEXT=XX ICP备XXXXXXXX号-1
           VUE_APP_ICP_URL=https://beian.miit.gov.cn/   (optional, this is the default) -->
    <% if (typeof VUE_APP_ICP_TEXT !== 'undefined' && VUE_APP_ICP_TEXT) { %>
    <footer id="icp-footer">
      <a
        href="<%- typeof VUE_APP_ICP_URL !== 'undefined' && VUE_APP_ICP_URL ? VUE_APP_ICP_URL : 'https://beian.miit.gov.cn/' %>"
        target="_blank"
        rel="noopener noreferrer"
        ><%- VUE_APP_ICP_TEXT %></a
      >
    </footer>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('vux_view_box_body').appendChild(document.getElementById('icp-footer'))
      })
    </script>
    <% } %>

    <!-- Gif Encoder -->
    <script async src="/lib/gif.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WSNZ3J3X2V"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())

      gtag('config', 'G-WSNZ3J3X2V')
    </script>
  </body>
</html>
